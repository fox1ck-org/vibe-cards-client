version: v2
managed:
  enabled: true
  disable:
    - module: buf.build/bufbuild/protovalidate
  override:
    - file_option: go_package_prefix
      value: github.com/fox1ck-org/vibe-cards-client/v2/conformance/gen
# Remote plugins are PINNED to what generated vibe-cards' own tree.
# Unpinned, buf.build/connectrpc/go resolves to connect v2 and rewrites every
# *.connect.go to import connectrpc.com/connect/v2. Bump a pin only together
# with vibe-cards and go.mod, never as a side effect of a proto refresh.
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: ../gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.19.1
    out: ../gen
    opt: paths=source_relative
